<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .navbar { background-color: #1f2229; border-bottom: 2px solid #f5b400; }
        .table-dark { background-color: #1f2229; }
        .btn-warning { background-color: #f5b400; border: none; font-weight: bold; }
        .btn-outline-danger:hover { color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand text-warning fw-bold" href="#">ADMIN PANEL</a>
        <div class="ms-auto">
            <span class="text-light me-3">Welcome, {{ session['user'] }}</span>
            <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>User Management</h2>
        <span class="badge bg-warning text-dark">{{ users|length }} Total Users</span>
    </div>

    <div class="card shadow bg-dark text-white border-secondary">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Password (Hash)</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td class="align-middle">{{ user[0] }}</td>
                        <td class="align-middle fw-bold">{{ user[1] }}</td>
                        <td class="align-middle">{{ user[2] }}</td>
                        <td class="align-middle">{{ user[3] }}</td>
                        <td class="align-middle text-truncate" style="max-width: 150px;">{{ user[4] }}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <a href="/edit/{{ user[0] }}" class="btn btn-sm btn-warning">Edit</a>
                                <a href="/delete/{{ user[0] }}" class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
