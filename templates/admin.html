<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { background-color: #1a1a1a !important; min-height: 100%; margin: 0; color: white; }
        .container { padding-top: 30px; padding-bottom: 30px; }
        .card { background-color: #2d2d2d; border: 1px solid #ff8c00; border-radius: 10px; overflow: hidden; }
        .table { color: white !important; margin-bottom: 0; }
        .table thead { background-color: #ff8c00; color: black; }
        .btn-orange { background-color: #ff8c00 !important; color: black !important; font-weight: bold; border: none; }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
        h2 { color: #ff8c00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>User Database</h2>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">Back</a>
        </div>
        
        <div class="card shadow">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Email</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr style="border-bottom: 1px solid #444;">
                            <td>{{ user[0] }}</td>
                            <td>{{ user[1] }}</td>
                            <td class="text-center">
                                <div class="d-flex gap-2 justify-content-center">
                                    <a href="/edit/{{ user[0] }}" class="btn btn-orange btn-sm">Edit</a>
                                    <a href="/delete/{{ user[0] }}" class="btn btn-danger btn-sm">Delete</a>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
