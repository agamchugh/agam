<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; padding: 20px; }
        .card { background: #1e1e26; border: none; border-radius: 15px; }
        .table { color: white; }
        input, select { font-size: 0.85rem !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-warning">Admin Control</h2>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
        </div>

        <div class="card p-3 shadow">
            <div class="table-responsive">
                <table class="table table-dark align-middle">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Mobile</th>
                            <th>Role</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in all_users %}
                        <tr>
                            <form action="/edit_user/{{ user.id }}" method="POST">
                                <td>
                                    <input type="text" name="username" value="{{ user.username }}" class="form-control form-control-sm bg-dark text-white border-secondary">
                                </td>
                                <td>
                                    <input type="text" name="mobile" value="{{ user.mobile }}" class="form-control form-control-sm bg-dark text-white border-secondary">
                                </td>
                                <td>
                                    <select name="role" class="form-select form-select-sm bg-dark text-white border-secondary">
                                        <option value="rider" {% if user.role == 'rider' %}selected{% endif %}>Rider</option>
                                        <option value="driver" {% if user.role == 'driver' %}selected{% endif %}>Driver</option>
                                    </select>
                                </td>
                                <td>
                                    <div class="d-flex gap-2 justify-content-center">
                                        <button type="submit" class="btn btn-success btn-sm">Save</button>
                            </form>
                                        <form action="/delete_user/{{ user.id }}" method="POST" onsubmit="return confirm('Delete this user?');">
                                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                        </form>
                                    </div>
                                </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
