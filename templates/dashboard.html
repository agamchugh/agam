<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rickshaw Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <style>
        body { background: #121212; color: white; overflow: hidden; height: 100vh; font-family: sans-serif; }
        #map { height: 60%; width: 100%; border-bottom: 4px solid #ffc107; }
        .ui-panel { height: 40%; padding: 15px; background: #1e1e26; border-radius: 30px 30px 0 0; position: relative; z-index: 1000; box-shadow: 0 -10px 20px rgba(0,0,0,0.5); overflow-y: auto; }
        .btn-main { background: #ffc107; color: black; font-weight: bold; padding: 12px; border-radius: 15px; width: 100%; border: none; font-size: 1.1rem; }
        .status-box { background: #2a2a35; padding: 12px; border-radius: 15px; margin-top: 10px; border-left: 4px solid #ffc107; }
        
        /* NAVIGATION LINE STYLING */
        .leaflet-routing-container { display: none !important; }
        path.leaflet-interactive { 
            stroke: #007bff; 
            stroke-width: 7; 
            stroke-opacity: 0.8; 
            stroke-linejoin: round;
        }
        .driver-marker { filter: hue-rotate(140deg); }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="ui-panel text-center">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0">Hi, <span class="text-warning">{{ username }}</span></h6>
            {% if is_admin %}<a href="/admin_panel" class="btn btn-info btn-sm fw-bold">ADMIN</a>{% endif %}
            <span id="stat-badge" class="badge bg-success">ONLINE</span>
        </div>

        {% if role == 'rider' %}
        <div id="rider-ui">
            <button id="bookBtn" class="btn-main">📍 REQUEST RICKSHAW</button>
            <div id="ride-info" class="status-box d-none text-start">
                <div id="msg" class="small text-secondary fw-bold">SEARCHING...</div>
                <div id="drv-name" class="fw-bold text-warning"></div>
                <div class="d-flex gap-2 mt-1">
                    <span id="dist-tag" class="badge bg-warning text-dark">-- km</span>
                    <span id="eta-tag" class="badge bg-info text-dark">ETA: -- mins</span>
                </div>
                <button id="cancelBtn" class="btn btn-outline-danger btn-sm w-100 mt-3">CANCEL RIDE</button>
            </div>
        </div>
        {% else %}
        <div id="driver-ui">
            <button id="offlineBtn" class="btn-main mb-2" style="background:#dc3545; color:white;">GO OFFLINE</button>
            <div id="active-ride-box" class="status-box d-none text-start">
                <div class="small text-secondary fw-bold">NAVIGATING TO RIDER...</div>
                <div id="rider-name-display" class="fw-bold text-warning"></div>
                <div id="driver-eta" class="badge bg-info text-dark mt-1">ETA: -- mins</div>
                <button id="finishBtn" class="btn btn-success btn-sm w-100 mt-3">FINISH TRIP</button>
            </div>
            <div id="req-box" class="status-box d-none bg-success border-0 text-white">
                <p class="mb-2">New Request: <span id="rider-name" class="fw-bold"></span></p>
                <button id="acceptBtn" class="btn btn-light btn-sm fw-bold w-100">ACCEPT RIDE</button>
            </div>
        </div>
        {% endif %}
        <div class="mt-3"><a href="/logout" class="text-secondary small">Logout</a></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([20.59, 78.96], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        var uMarker = L.marker([0,0]).addTo(map);
        var otherMarker = L.marker([0,0], {icon: L.icon({iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png', className: 'driver-marker'})}).addTo(map).setOpacity(0);
        var routingControl = null;

        function updateRouting(myPos, targetPos) {
            if (routingControl) map.removeControl(routingControl);
            routingControl = L.Routing.control({
                waypoints: [L.latLng(myPos[0], myPos[1]), L.latLng(targetPos[0], targetPos[1])],
                routeWhileDragging: false,
                addWaypoints: false,
                createMarker: function() { return null; },
                lineOptions: { styles: [{ color: '#007bff', weight: 7 }] }
            }).on('routesfound', function(e) {
                var sum = e.routes[0].summary;
                var mins = Math.round(sum.totalTime / 60);
                var km = (sum.totalDistance / 1000).toFixed(1);
                if(document.getElementById('eta-tag')) document.getElementById('eta-tag').innerText = "ETA: " + mins + " mins";
                if(document.getElementById('dist-tag')) document.getElementById('dist-tag').innerText = km + " km";
                if(document.getElementById('driver-eta')) document.getElementById('driver-eta').innerText = "ETA: " + mins + " mins";
            }).addTo(map);
        }

        function sync() {
            navigator.geolocation.getCurrentPosition(p => {
                let lt = p.coords.latitude, ln = p.coords.longitude;
                uMarker.setLatLng([lt, ln]);
                fetch('/update_location', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({latitude:lt, longitude:ln})});

                fetch('/get_active_ride').then(r => r.json()).then(d => {
                    if(d.status === 'accepted') {
                        otherMarker.setLatLng([d.lat, d.lon]).setOpacity(1);
                        updateRouting([lt, ln], [d.lat, d.lon]);
                        if(document.getElementById('ride-info')) document.getElementById('ride-info').classList.remove('d-none');
                        if(document.getElementById('bookBtn')) document.getElementById('bookBtn').classList.add('d-none');
                        if(document.getElementById('msg')) document.getElementById('msg').innerText = "✅ RICKSHAW ARRIVING";
                        if(document.getElementById('drv-name')) document.getElementById('drv-name').innerText = d.name;
                        if(document.getElementById('active-ride-box')) {
                            document.getElementById('active-ride-box').classList.remove('d-none');
                            document.getElementById('rider-name-display').innerText = d.name;
                        }
                    } else if (routingControl) { 
                        map.removeControl(routingControl); 
                        routingControl = null; 
                        otherMarker.setOpacity(0); 
                    }
                });
            });
        }
        setInterval(sync, 5000); sync();

        {% if role == 'rider' %}
        document.getElementById('bookBtn').onclick = () => {
            document.getElementById('bookBtn').classList.add('d-none');
            document.getElementById('ride-info').classList.remove('d-none');
            fetch('/book_ride', {method:'POST'});
        };
        document.getElementById('cancelBtn').onclick = () => fetch('/cancel_ride', {method:'POST'}).then(() => location.reload());
        {% else %}
        let curR = null;
        setInterval(() => {
            if(curR) return;
            fetch('/check_requests').then(r => r.json()).then(d => {
                if(d.ride_id) {
                    curR = d.ride_id; document.getElementById('rider-name').innerText = d.rider_name;
                    document.getElementById('req-box').classList.remove('d-none');
                }
            });
        }, 3000);
        document.getElementById('acceptBtn').onclick = () => fetch('/accept_ride/'+curR, {method:'POST'}).then(() => document.getElementById('req-box').classList.add('d-none'));
        document.getElementById('finishBtn').onclick = () => fetch('/cancel_ride', {method:'POST'}).then(() => location.reload());
        document.getElementById('offlineBtn').onclick = function() {
            fetch('/toggle_status', {method:'POST'}).then(r => r.json()).then(d => {
                let b = document.getElementById('stat-badge');
                if(d.is_online) { b.className="badge bg-success"; b.innerText="ONLINE"; this.innerText="GO OFFLINE"; this.style.background="#dc3545"; }
                else { b.className="badge bg-danger"; b.innerText="OFFLINE"; this.innerText="GO ONLINE"; this.style.background="#28a745"; }
            });
        };
        {% endif %}
    </script>
</body>
</html>
