<div id="rider-ui" class="{% if role != 'rider' %}d-none{% endif %}">
    <div id="booking-area">
        <button class="btn btn-warning w-100 py-3 mb-3" onclick="bookRide()">BOOK A RICKSHAW</button>
    </div>

    <div id="active-ride-area" class="d-none">
        <div class="card bg-dark text-white p-3">
            <p class="mb-1 text-muted">GIVE THIS OTP TO DRIVER:</p>
            <div id="otp-display" class="h1 text-warning font-monospace">----</div>
            <hr>
            <p id="ride-status">Waiting for Driver...</p>
            <button class="btn btn-danger w-100" onclick="cancelRide()">CANCEL RIDE</button>
        </div>
    </div>
</div>

<script>
function sync() {
    fetch('/get_active_ride')
    .then(r => r.json())
    .then(data => {
        if (data.status !== "none") {
            document.getElementById('booking-area').classList.add('d-none');
            document.getElementById('active-ride-area').classList.remove('d-none');
            
            // Fix: OTP Visibility
            if (data.otp) {
                document.getElementById('otp-display').innerText = data.otp;
            }
            document.getElementById('ride-status').innerText = "Status: " + data.status;
        } else {
            document.getElementById('booking-area').classList.remove('d-none');
            document.getElementById('active-ride-area').classList.add('d-none');
        }
    });
}

function cancelRide() {
    if (confirm("Are you sure you want to cancel?")) {
        fetch('/cancel_ride', { method: 'POST' })
        .then(() => location.reload());
    }
}

function bookRide() {
    fetch('/book_ride', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'success') sync();
        else alert("No drivers nearby!");
    });
}

setInterval(sync, 4000); // Check every 4 seconds
</script>
