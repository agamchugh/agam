<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1f2229; border: 1px solid #444; border-radius: 15px; padding: 40px; width: 100%; max-width: 450px; text-align: center; }
        .btn-warning { background-color: #f5b400; border: none; font-weight: bold; color: #121212; transition: 0.3s; }
        .btn-warning:hover { background-color: #d49b00; transform: translateY(-2px); }
        .user-icon { font-size: 60px; color: #f5b400; margin-bottom: 20px; }
        .admin-badge { font-size: 0.7rem; vertical-align: middle; margin-left: 5px; }
    </style>
</head>
<body>

<div class="card shadow-lg">
    <div class="user-icon">👤</div>
    <h2 class="mb-2">Welcome, <span class="text-warning">{{ name }}</span>!</h2>
    <p class="text-muted mb-4 small">{{ session['email'] }}</p>
    
    <div class="d-grid gap-3">
        
        {% if session['email'] == "agamchugh153@gmail.com" %}
            <div class="alert alert-dark border-secondary py-2 small mb-1">
                Verified Administrator Access 🛡️
            </div>
            <a href="/admin" class="btn btn-warning py-2">Go to Admin Panel</a>
        {% endif %}
        <a href="/logout" class="btn btn-outline-light">Logout</a>
    </div>
</div>

</body>
</html>
