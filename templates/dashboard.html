<div id="rider-ui" class="{% if role != 'rider' %}d-none{% endif %}">
    <div id="booking-area">
        <button class="btn btn-warning w-100 py-3 mb-3" onclick="bookRide()">BOOK A RICKSHAW</button>
    </div>

    <div id="active-ride-area" class="d-none">
        <div class="card bg-dark text-white p-3 border-warning">
            <p class="mb-1 text-center text-muted small">GIVE THIS OTP TO DRIVER:</p>
            <div id="otp-display" class="display-4 text-center text-warning font-monospace fw-bold">----</div>
            <hr class="border-secondary">
            <p id="ride-status" class="text-center badge bg-warning text-dark w-100 py-2">Waiting for Driver...</p>
            
            <button class="btn btn-outline-danger w-100 mt-3" onclick="cancelRide()">
                CANCEL RIDE
            </button>
        </div>
    </div>
</div>

<script>
function sync() {
    fetch('/get_active_ride')
    .then(r => r.json())
    .then(data => {
        if (data.status !== "none") {
            document.getElementById('booking-area').classList.add('d-none');
            document.getElementById('active-ride-area').classList.remove('d-none');
            
            // Updates OTP display from server data
            if (data.otp) {
                document.getElementById('otp-display').innerText = data.otp;
            }
            document.getElementById('ride-status').innerText = "STATUS: " + data.status.toUpperCase();
        } else {
            document.getElementById('booking-area').classList.remove('d-none');
            document.getElementById('active-ride-area').classList.add('d-none');
        }
    });
}

function cancelRide() {
    if (confirm("Are you sure you want to cancel your ride?")) {
        fetch('/cancel_ride', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                location.reload();
            }
        });
    }
}

function bookRide() {
    fetch('/book_ride', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'success') sync();
        else alert("No drivers nearby!");
    });
}

// Driver side verification function (ensure this is in your driver script area)
function verifyOTP() {
    const otpInput = document.getElementById('otp-input').value;
    fetch('/verify_ride_otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ otp: otpInput })
    })
    .then(r => r.json())
    .then(data => {
        if(data.success) {
            location.reload();
        } else {
            alert(data.message || "Invalid OTP");
        }
    });
}

setInterval(sync, 4000); // Check every 4 seconds
</script>
