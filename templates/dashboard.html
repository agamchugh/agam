<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e1e26; border-radius: 20px; padding: 25px; border: none; margin-top: 15px; }
        #map { height: 220px; width: 100%; border-radius: 15px; margin-top: 10px; border: 1px solid #444; }
        .btn-main { background: #ffc107; color: black; font-weight: bold; border-radius: 12px; width: 100%; padding: 12px; border: none; margin-top: 15px; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .bg-online { background: #28a745; }
        .bg-offline { background: #dc3545; }
        .status-card { background: #2a2a35; padding: 15px; border-radius: 12px; border-left: 4px solid #ffc107; margin-top: 15px; }
    </style>
</head>
<body class="container">
    <div class="card shadow-lg text-center">
        <h5 class="mb-1">Hello, <span style="color:#ffc107">{{ username }}</span></h5>
        <div class="mb-2">
            <span class="badge bg-dark text-warning">{{ role.upper() }}</span>
            <span id="stat-badge" class="status-badge bg-online">ONLINE</span>
        </div>

        <div id="map"></div>

        {% if role == 'rider' %}
        <button id="bookBtn" class="btn-main">📍 FIND A RICKSHAW</button>
        <div id="ride-info" class="status-card d-none text-start">
            <div id="status-text" class="small">Searching for drivers...</div>
            <div id="driver-details" class="fw-bold text-warning mt-1"></div>
        </div>
        {% else %}
        <button id="offlineBtn" class="btn-main" style="background:#dc3545; color:white;">GO OFFLINE</button>
        <div id="incoming-box" class="status-card d-none">
            <p class="mb-2">New Request: <span id="req-name" class="text-warning"></span></p>
            <button id="acceptBtn" class="btn btn-success w-100 fw-bold">ACCEPT RIDE</button>
        </div>
        {% endif %}
        <a href="/logout" class="btn btn-link text-secondary btn-sm mt-3">Logout</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([20.5937, 78.9629], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var marker = L.marker([0,0]).addTo(map);

        function syncLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                let lat = pos.coords.latitude, lon = pos.coords.longitude;
                map.setView([lat, lon], 15);
                marker.setLatLng([lat, lon]);
                fetch('/update_location', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({latitude: lat, longitude: lon})
                });
            });
        }
        setInterval(syncLocation, 30000); syncLocation();

        // OFFLINE TOGGLE
        if (document.getElementById('offlineBtn')) {
            document.getElementById('offlineBtn').onclick = function() {
                fetch('/toggle_status', {method: 'POST'}).then(res => res.json()).then(data => {
                    let b = document.getElementById('stat-badge');
                    if(data.is_online) {
                        b.className = "status-badge bg-online"; b.innerText = "ONLINE";
                        this.innerText = "GO OFFLINE"; this.style.background = "#dc3545";
                    } else {
                        b.className = "status-badge bg-offline"; b.innerText = "OFFLINE";
                        this.innerText = "GO ONLINE"; this.style.background = "#28a745";
                    }
                });
            };
        }

        // RIDER BOOKING
        if (document.getElementById('bookBtn')) {
            document.getElementById('bookBtn').onclick = function() {
                this.classList.add('d-none');
                document.getElementById('ride-info').classList.remove('d-none');
                fetch('/book_ride', {method: 'POST'});
                let check = setInterval(() => {
                    fetch('/ride_status').then(r => r.json()).then(d => {
                        if(d.status === 'accepted') {
                            clearInterval(check);
                            document.getElementById('status-text').innerText = "✅ RIDE CONFIRMED";
                            document.getElementById('driver-details').innerHTML = `Driver: ${d.driver_name}<br>📞 ${d.driver_phone}`;
                        }
                    });
                }, 3000);
            };
        }

        // DRIVER REQUESTS
        {% if role == 'driver' %}
        let curRide = null;
        setInterval(() => {
            fetch('/check_requests').then(r => r.json()).then(d => {
                if(d.ride_id && !curRide) {
                    curRide = d.ride_id;
                    document.getElementById('req-name').innerText = d.rider_name;
                    document.getElementById('incoming-box').classList.remove('d-none');
                }
            });
        }, 5000);
        document.getElementById('acceptBtn').onclick = function() {
            fetch('/accept_ride/' + curRide, {method: 'POST'}).then(() => {
                document.getElementById('incoming-box').classList.add('d-none');
                alert("Ride Accepted!"); curRide = null;
            });
        };
        {% endif %}
    </script>
</body>
</html>
