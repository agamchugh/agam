<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { background-color: #1a1a1a !important; height: 100%; margin: 0; color: white; }
        .full-screen-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #1a1a1a; }
        .card { background-color: #2d2d2d; color: white; border: 2px solid #ff8c00; border-radius: 20px; width: 100%; max-width: 450px; }
        h1 { color: #ff8c00; font-weight: bold; }
        .btn-orange { background-color: #ff8c00 !important; color: black !important; font-weight: bold; border: none; }
        .btn-orange:hover { background-color: #e67e00 !important; }
        hr { border-top: 1px solid #ff8c00; opacity: 0.3; }
    </style>
</head>
<body>
    <div class="full-screen-bg container-fluid p-3">
        <div class="card shadow-lg p-5 text-center">
            <h1 class="display-6">Welcome Back</h1>
            <p class="lead text-light mb-4">{{ email }}</p>
            <hr>
            
            <div class="d-grid gap-3 mt-2">
                {% if is_admin %}
                <a href="/admin" class="btn btn-orange btn-lg shadow">ADMIN PANEL</a>
                {% endif %}
                
                <a href="/logout" class="btn btn-outline-light btn-sm mt-2">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
