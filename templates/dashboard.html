<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #0b0b0b; color: white; font-family: sans-serif; }
        #map { height: 35vh; width: 100%; border-bottom: 3px solid #ff9800; }
        .nav-header { background: #000; padding: 15px; border-bottom: 1px solid #222; }
        .card { background-color: #1a1a1a !important; border: 1px solid #333; border-radius: 12px; }
        .btn-warning { background-color: #ff9800; color: #000; font-weight: bold; border: none; }
        .text-warning { color: #ff9800 !important; }
        .otp-box { background: #000; border-radius: 8px; font-size: 2.5rem; letter-spacing: 5px; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="nav-header d-flex justify-content-between align-items-center">
    <div>Hi, <span class="text-warning fw-bold">{{ username }}</span></div>
    <a href="/logout" class="text-muted small text-decoration-none">Logout</a>
</div>

<div class="container mt-4">
    {% if role == 'rider' %}
    <div id="booking-area">
        <button class="btn btn-warning w-100 py-3 shadow" onclick="bookRide()">BOOK A RICKSHAW</button>
    </div>
    <div id="active-ride-area" class="d-none">
        <div class="card p-4 border-warning">
            <p class="text-center text-muted small">YOUR OTP:</p>
            <div id="otp-display" class="otp-box text-center text-warning fw-bold py-2 mb-3">----</div>
            <div id="ride-status" class="badge bg-warning text-dark w-100 py-2 mb-3">PENDING</div>
            <button class="btn btn-outline-danger w-100" onclick="cancelRide()">CANCEL RIDE</button>
        </div>
    </div>
    {% endif %}

    {% if role == 'driver' %}
    <button id="status-btn" class="btn btn-success w-100 py-3 mb-4" onclick="toggleStatus()">GO ONLINE</button>
    <div id="driver-active-area" class="d-none">
        <div class="card p-4 border-warning">
            <h6 class="text-warning">Rider: <span id="rider-name" class="text-white">---</span></h6>
            <div id="otp-input-section">
                <input type="number" id="otp-input" class="form-control text-center mb-2 bg-dark text-white border-secondary" placeholder="Enter OTP">
                <button class="btn btn-warning w-100" onclick="verifyOTP()">START TRIP</button>
            </div>
            <div id="finish-section" class="d-none">
                <button class="btn btn-success w-100 py-3" onclick="finishTrip()">FINISH TRIP</button>
            </div>
            <button class="btn btn-link text-danger w-100 mt-2" onclick="cancelRide()">Cancel</button>
        </div>
    </div>
    {% endif %}

    {% if is_admin %}
    <div class="mt-5 pt-4 border-top border-secondary">
        <h5 class="text-warning mb-3">ADMIN TOOLS</h5>
        <button class="btn btn-danger w-100" onclick="resetSystem()">RESET ALL RIDES</button>
    </div>
    {% endif %}
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { zoomControl: false }).setView([30.47, 74.51], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    var userMarker = L.marker([0, 0]).addTo(map);
    var partnerMarker = L.marker([0, 0], {opacity: 0}).addTo(map);

    function sync() {
        fetch('/get_active_ride').then(r => r.json()).then(data => {
            if (data.status !== "none") {
                if (data.lat) partnerMarker.setLatLng([data.lat, data.lon]).setOpacity(1);
                {% if role == 'rider' %}
                    document.getElementById('booking-area').classList.add('d-none');
                    document.getElementById('active-ride-area').classList.remove('d-none');
                    document.getElementById('otp-display').innerText = data.otp;
                    document.getElementById('ride-status').innerText = data.status.toUpperCase();
                {% else %}
                    document.getElementById('driver-active-area').classList.remove('d-none');
                    document.getElementById('rider-name').innerText = data.name;
                    if (data.status === 'started') {
                        document.getElementById('otp-input-section').classList.add('d-none');
                        document.getElementById('finish-section').classList.remove('d-none');
                    }
                {% endif %}
            } else {
                partnerMarker.setOpacity(0);
                if (document.getElementById('booking-area')) document.getElementById('booking-area').classList.remove('d-none');
                if (document.getElementById('active-ride-area')) document.getElementById('active-ride-area').classList.add('d-none');
                if (document.getElementById('driver-active-area')) document.getElementById('driver-active-area').classList.add('d-none');
            }
        });
    }

    function verifyOTP() {
        const val = document.getElementById('otp-input').value;
        fetch('/verify_ride_otp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ otp: val.toString().trim() })
        }).then(r => r.json()).then(d => d.success ? sync() : alert(d.message));
    }

    function cancelRide() { fetch('/cancel_ride', {method: 'POST'}).then(() => sync()); }
    function resetSystem() { if(confirm("Reset?")) fetch('/admin/reset_system', {method:'POST'}).then(() => location.reload()); }
    
    setInterval(sync, 4000);
    sync();
</script>
</body>
</html>
