<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { 
            background-color: #1a1a1a !important; 
            height: 100%; 
            margin: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card { 
            background-color: #24252a; 
            border: 1px solid #343a40; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            padding: 30px;
        }
        /* FIX: Changed Welcome text to White */
        .welcome-text { 
            color: #ffffff; 
            font-size: 1.8rem; 
            margin-bottom: 0;
            display: inline;
        }
        .user-name { 
            color: #ffc107; /* Bright Yellow/Orange */
            font-size: 1.8rem; 
            font-weight: bold;
        }
        .admin-badge {
            background-color: #ced4da;
            color: #495057;
            border-radius: 8px;
            padding: 10px;
            font-weight: 500;
            margin-top: 20px;
            display: block;
            text-decoration: none;
        }
        .btn-orange { 
            background-color: #ffc107 !important; 
            color: black !important; 
            font-weight: bold; 
            border: none; 
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .btn-logout {
            background-color: transparent;
            color: white;
            border: 1px solid white;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="card text-center shadow-lg">
        <div class="mb-3">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="80" style="filter: invert(42%) sepia(93%) deg(20deg) saturate(1000%);">
        </div>

        <div>
            <span class="welcome-text">Welcome, </span>
            <span class="user-name">{{ username if username else 'User' }}</span>
        </div>
        <p class="text-secondary small">{{ email }}</p>

        {% if is_admin %}
        <div class="admin-badge">
            Verified Administrator Access 🛡️
        </div>
        
        <a href="/admin" class="btn btn-orange w-100">Go to Admin Panel</a>
        {% endif %}

        <a href="/logout" class="btn btn-logout w-100">Logout</a>
    </div>

</body>
</html>
