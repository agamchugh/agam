<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([20.59, 78.96], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var uMarker = L.marker([0,0]).addTo(map);
        var otherMarker = L.marker([0,0], {icon: L.icon({iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png', className: 'driver-marker'})}).addTo(map).setOpacity(0);
        var routingControl = null;
        var isSyncing = false;

        function updateRouting(p1, p2) {
            if (routingControl) {
                routingControl.setWaypoints([L.latLng(p1[0], p1[1]), L.latLng(p2[0], p2[1])]);
            } else {
                routingControl = L.Routing.control({
                    waypoints: [L.latLng(p1[0], p1[1]), L.latLng(p2[0], p2[1])],
                    createMarker: () => null,
                    lineOptions: { styles: [{ color: '#007bff', weight: 8, opacity: 0.9 }] },
                    addWaypoints: false,
                    fitSelectedRoutes: false // Set to false to prevent map jumping
                }).on('routesfound', function(e) {
                    var s = e.routes[0].summary;
                    var mins = Math.round(s.totalTime / 60);
                    var km = (s.totalDistance / 1000).toFixed(1);
                    if(document.getElementById('eta-tag')) document.getElementById('eta-tag').innerText = "ETA: " + mins + " mins";
                    if(document.getElementById('dist-tag')) document.getElementById('dist-tag').innerText = km + " km";
                    if(document.getElementById('driver-eta')) document.getElementById('driver-eta').innerText = "ETA: " + mins + " mins";
                }).addTo(map);
            }
        }

        async function sync() {
            if (isSyncing) return;
            isSyncing = true;

            navigator.geolocation.getCurrentPosition(async p => {
                let lt = p.coords.latitude, ln = p.coords.longitude;
                uMarker.setLatLng([lt, ln]);

                try {
                    // Update location
                    await fetch('/update_location', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({latitude:lt, longitude:ln})});
                    
                    // Check ride status
                    let res = await fetch('/get_active_ride');
                    let d = await res.json();

                    if(d.status === 'accepted') {
                        otherMarker.setLatLng([d.lat, d.lon]).setOpacity(1);
                        updateRouting([lt, ln], [d.lat, d.lon]);
                        document.getElementById('ride-info')?.classList.remove('d-none');
                        document.getElementById('bookBtn')?.classList.add('d-none');
                        if(document.getElementById('drv-name')) document.getElementById('drv-name').innerText = d.name;
                        if(document.getElementById('active-ride-box')) {
                            document.getElementById('active-ride-box').classList.remove('d-none');
                            document.getElementById('rider-name-display').innerText = d.name;
                        }
                    } else if (d.status === 'completed') {
                        alert("Trip Finished!");
                        await fetch('/clear_completed_ride', {method:'POST'});
                        location.reload();
                    }
                } catch(e) { console.log("Sync Error", e); }
                isSyncing = false;
            }, err => { isSyncing = false; }, {enableHighAccuracy: true});
        }

        setInterval(sync, 3000); // 3 seconds interval for better balance
        sync();

        {% if role == 'rider' %}
        document.getElementById('bookBtn').onclick = () => {
            fetch('/book_ride', {method:'POST'}).then(r => r.json()).then(d => {
                if(d.status === 'none') alert("No drivers within 1.5km!");
            });
        };
        {% else %}
        let curR = null;
        setInterval(async () => {
            if(curR) return;
            let r = await fetch('/check_requests');
            let d = await r.json();
            if(d.ride_id) {
                curR = d.ride_id; 
                document.getElementById('rider-name').innerText = d.rider_name;
                document.getElementById('req-box').classList.remove('d-none');
            }
        }, 3000);

        document.getElementById('acceptBtn').onclick = () => {
            fetch('/accept_ride/'+curR, {method:'POST'}).then(() => {
                document.getElementById('req-box').classList.add('d-none');
                sync();
            });
        };
        
        document.getElementById('finishBtn').onclick = async () => {
            if(confirm("Complete trip?")) {
                await fetch('/finish_trip', {method:'POST'});
                await fetch('/clear_completed_ride', {method:'POST'});
                location.reload();
            }
        };

        document.getElementById('offlineBtn').onclick = function() {
            fetch('/toggle_status', {method:'POST'}).then(r => r.json()).then(d => {
                let b = document.getElementById('stat-badge');
                b.className = d.is_online ? "badge bg-success" : "badge bg-danger";
                b.innerText = d.is_online ? "ONLINE" : "OFFLINE";
                this.innerText = d.is_online ? "GO OFFLINE" : "GO ONLINE";
                this.style.background = d.is_online ? "#dc3545" : "#28a745";
            });
        };
        {% endif %}
    </script>
