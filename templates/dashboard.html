<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rickshaw Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <style>
        body { background: #121212; color: white; overflow: hidden; height: 100vh; margin: 0; }
        #map { height: 60%; width: 100%; border-bottom: 4px solid #ffc107; background: #1a1a1a; }
        .ui-panel { height: 40%; padding: 15px; background: #1e1e26; border-radius: 30px 30px 0 0; z-index: 1000; position: relative; overflow-y: auto; }
        .btn-main { background: #ffc107; color: black; font-weight: bold; padding: 12px; border-radius: 15px; width: 100%; border: none; }
        .status-box { background: #2a2a35; padding: 12px; border-radius: 15px; margin-top: 10px; border-left: 4px solid #ffc107; }
        /* Hide the ugly text box from Leaflet Routing */
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="ui-panel text-center">
        <div class="d-flex justify-content-between mb-3 align-items-center">
            <h6 class="mb-0">Hi, <span class="text-warning">{{ username }}</span></h6>
            <div class="d-flex gap-2">
                {% if is_admin %}<a href="/admin_panel" class="btn btn-info btn-sm fw-bold">ADMIN</a>{% endif %}
                <span id="stat-badge" class="badge bg-success">ONLINE</span>
            </div>
        </div>

        {% if role == 'rider' %}
        <div id="rider-ui">
            <button id="bookBtn" class="btn-main shadow">📍 REQUEST RICKSHAW</button>
            <div id="ride-info" class="status-box d-none text-start">
                <div class="small text-secondary fw-bold">✅ RICKSHAW EN ROUTE</div>
                <div id="drv-name" class="fw-bold text-warning">--</div>
                <div class="mt-1">
                    <span id="dist-tag" class="badge bg-warning text-dark">Calculating...</span>
                </div>
            </div>
        </div>
        {% else %}
        <div id="driver-ui">
            <button id="offlineBtn" class="btn-main mb-2" style="background:#dc3545; color:white;">GO OFFLINE</button>
            <div id="active-ride-box" class="status-box d-none text-start">
                <div class="small text-secondary fw-bold">NAVIGATING TO RIDER...</div>
                <div id="rider-name-display" class="fw-bold text-warning">--</div>
                <button id="finishBtn" class="btn btn-success btn-sm w-100 mt-3 shadow">FINISH TRIP</button>
            </div>
            <div id="req-box" class="status-box d-none bg-success border-0 text-white">
                <p class="mb-2">New Request: <span id="rider-name" class="fw-bold"></span></p>
                <button id="acceptBtn" class="btn btn-light btn-sm fw-bold w-100">ACCEPT RIDE</button>
            </div>
        </div>
        {% endif %}
        <div class="mt-3"><a href="/logout" class="text-secondary small">Logout</a></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script>
        // 1. Setup Map
        var map = L.map('map', {zoomControl: false}).setView([20.59, 78.96], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        var uMarker = L.marker([0,0]).addTo(map);
        var otherMarker = L.marker([0,0]).addTo(map).setOpacity(0);
        var routingControl = null;
        var hasCentered = false; // To center only once at start or when ride starts

        // 2. Navigation / Route Drawing logic
        function updateRoute(start, end) {
            if (routingControl) {
                routingControl.setWaypoints([L.latLng(start[0], start[1]), L.latLng(end[0], end[1])]);
            } else {
                routingControl = L.Routing.control({
                    waypoints: [L.latLng(start[0], start[1]), L.latLng(end[0], end[1])],
                    router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                    lineOptions: { styles: [{ color: '#007bff', weight: 6 }] },
                    createMarker: function() { return null; }, // Hide default markers
                    addWaypoints: false,
                    fitSelectedRoutes: true
                }).addTo(map);
            }
        }

        // 3. Core Sync Logic
        async function sync() {
            navigator.geolocation.getCurrentPosition(async p => {
                let lt = p.coords.latitude, ln = p.coords.longitude;
                
                // UPDATE SELF MARKER
                uMarker.setLatLng([lt, ln]);
                
                // AUTO-CENTER MAP (Crucial for "not navigating" fix)
                if (!hasCentered) {
                    map.setView([lt, ln], 16);
                    hasCentered = true;
                }

                // Send to Server
                try {
                    await fetch('/update_location', {
                        method:'POST', 
                        headers:{'Content-Type':'application/json'}, 
                        body:JSON.stringify({latitude:lt, longitude:ln})
                    });

                    // Check for active rides
                    let r = await fetch('/get_active_ride');
                    let d = await r.json();

                    if (d.status === 'accepted') {
                        otherMarker.setLatLng([d.lat, d.lon]).setOpacity(1);
                        updateRoute([lt, ln], [d.lat, d.lon]); // DRAW STREET ROUTE
                        
                        // Show UI panels
                        document.getElementById('ride-info')?.classList.remove('d-none');
                        document.getElementById('bookBtn')?.classList.add('d-none');
                        document.getElementById('active-ride-box')?.classList.remove('d-none');
                        if (document.getElementById('drv-name')) document.getElementById('drv-name').innerText = d.name;
                        if (document.getElementById('rider-name-display')) document.getElementById('rider-name-display').innerText = d.name;
                    } 
                    else if (d.status === 'completed') {
                        alert("Trip Completed!");
                        await fetch('/clear_completed_ride', {method:'POST'});
                        location.reload();
                    }
                } catch(e) {}
            }, (err) => {
                console.error("GPS Error:", err);
            }, {enableHighAccuracy: true});
        }

        setInterval(sync, 4000); 
        sync();

        // 4. Button Actions
        {% if role == 'rider' %}
        document.getElementById('bookBtn').onclick = () => {
            fetch('/book_ride', {method:'POST'}).then(r => r.json()).then(d => {
                if(d.status === 'none') alert("No drivers within 50km!");
                else {
                    document.getElementById('bookBtn').innerText = "⌛ WAITING FOR DRIVER...";
                    document.getElementById('bookBtn').disabled = true;
                }
            });
        };
        {% else %}
        setInterval(async () => {
            let r = await fetch('/check_requests');
            let d = await r.json();
            if(d.ride_id) {
                document.getElementById('rider-name').innerText = d.rider_name;
                document.getElementById('req-box').classList.remove('d-none');
                window.curRideId = d.ride_id;
            }
        }, 3000);

        document.getElementById('acceptBtn').onclick = () => {
            fetch('/accept_ride/'+window.curRideId, {method:'POST'}).then(() => {
                document.getElementById('req-box').classList.add('d-none');
                hasCentered = false; // Re-center map to the new route
                sync();
            });
        };

        document.getElementById('finishBtn').onclick = async () => {
            await fetch('/finish_trip', {method:'POST'});
            location.reload();
        };

        document.getElementById('offlineBtn').onclick = function() {
            fetch('/toggle_status', {method:'POST'}).then(r => r.json()).then(d => {
                let b = document.getElementById('stat-badge');
                b.className = d.is_online ? "badge bg-success" : "badge bg-danger";
                b.innerText = d.is_online ? "ONLINE" : "OFFLINE";
                this.innerText = d.is_online ? "GO OFFLINE" : "GO ONLINE";
                this.style.background = d.is_online ? "#dc3545" : "#28a745";
            });
        };
        {% endif %}
    </script>
</body>
</html>
