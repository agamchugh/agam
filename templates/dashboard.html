<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rickshaw Live Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e1e26; border-radius: 25px; padding: 20px; border: none; margin-top: 10px; }
        /* INCREASED MAP HEIGHT */
        #map { height: 450px; width: 100%; border-radius: 20px; border: 2px solid #333; }
        .btn-main { background: #ffc107; color: black; font-weight: bold; border-radius: 15px; width: 100%; padding: 15px; border: none; font-size: 1.1rem; }
        .status-card { background: #2a2a35; padding: 15px; border-radius: 15px; border-left: 5px solid #ffc107; margin-top: 15px; }
        .driver-icon { filter: hue-rotate(120deg); } /* Different color for drivers */
    </style>
</head>
<body class="container-fluid">
    <div class="card shadow-lg text-center">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0">Hi, <span style="color:#ffc107">{{ username }}</span></h5>
            <span id="stat-badge" class="badge bg-success">ONLINE</span>
        </div>

        <div id="map"></div>

        {% if role == 'rider' %}
        <button id="bookBtn" class="btn-main mt-3 shadow">🚀 REQUEST RICKSHAW</button>
        <div id="ride-info" class="status-card d-none">
            <div id="status-text" class="fw-bold text-warning">Finding nearby drivers...</div>
            <div id="driver-details" class="small mt-1"></div>
            <div id="distance-info" class="badge bg-dark mt-2 p-2"></div>
        </div>
        {% else %}
        <button id="offlineBtn" class="btn-main mt-3" style="background:#dc3545; color:white;">GO OFFLINE</button>
        <div id="incoming-box" class="status-card d-none">
            <p class="mb-1">New Trip Request!</p>
            <h6 id="req-name" class="text-warning"></h6>
            <button id="acceptBtn" class="btn btn-success w-100 fw-bold py-2">ACCEPT RIDE</button>
        </div>
        {% endif %}
        
        <a href="/logout" class="btn btn-link text-secondary btn-sm">Logout</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Setup Map
        var map = L.map('map').setView([20.5937, 78.9629], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        var userMarker = L.marker([0,0]).addTo(map).bindPopup("You are here");
        var driverMarkers = {}; // To track all nearby drivers
        var activeDriverMarker = L.marker([0,0], {opacity: 0}).addTo(map); // For the one you booked

        function getDist(lat1, lon1, lat2, lon2) {
            var R = 6371; var dLat = (lat2-lat1) * Math.PI / 180;
            var dLon = (lon2-lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
        }

        function syncLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                let lat = pos.coords.latitude, lon = pos.coords.longitude;
                userMarker.setLatLng([lat, lon]);
                map.panTo([lat, lon]);
                
                fetch('/update_location', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({latitude: lat, longitude: lon})
                });

                // RIDER: SEE NEARBY DRIVERS
                if ("{{role}}" === "rider") {
                    fetch('/get_nearby_drivers').then(r => r.json()).then(drivers => {
                        drivers.forEach(d => {
                            if (!driverMarkers[d.name]) {
                                driverMarkers[d.name] = L.marker([d.lat, d.lon]).addTo(map)
                                    .bindTooltip(d.name, {permanent: false});
                            } else {
                                driverMarkers[d.name].setLatLng([d.lat, d.lon]);
                            }
                        });
                    });
                }
            });
        }
        setInterval(syncLocation, 10000); syncLocation();

        // RIDER BOOKING & TRACKING
        if (document.getElementById('bookBtn')) {
            document.getElementById('bookBtn').onclick = function() {
                this.classList.add('d-none');
                document.getElementById('ride-info').classList.remove('d-none');
                fetch('/book_ride', {method: 'POST'});

                let tracker = setInterval(() => {
                    fetch('/ride_status').then(r => r.json()).then(d => {
                        if(d.status === 'accepted') {
                            document.getElementById('status-text').innerText = "✅ DRIVER ARRIVING";
                            document.getElementById('driver-details').innerHTML = `${d.driver_name} | 📞 ${d.driver_phone}`;
                            
                            // Show distance
                            let riderPos = userMarker.getLatLng();
                            let dist = getDist(riderPos.lat, riderPos.lng, d.d_lat, d.d_lon);
                            document.getElementById('distance-info').innerText = `${dist} km away`;
                            
                            // Move active driver on map
                            activeDriverMarker.setOpacity(1).setLatLng([d.d_lat, d.d_lon]);
                        }
                    });
                }, 5000);
            };
        }

        // DRIVER LOGIC
        {% if role == 'driver' %}
        let curRide = null;
        setInterval(() => {
            fetch('/check_requests').then(r => r.json()).then(d => {
                if(d.ride_id && !curRide) {
                    curRide = d.ride_id;
                    document.getElementById('req-name').innerText = d.rider_name;
                    document.getElementById('incoming-box').classList.remove('d-none');
                }
            });
        }, 5000);

        document.getElementById('acceptBtn').onclick = function() {
            fetch('/accept_ride/' + curRide, {method: 'POST'}).then(() => {
                document.getElementById('incoming-box').classList.add('d-none');
                curRide = null;
                alert("Ride Started!");
            });
        };

        document.getElementById('offlineBtn').onclick = function() {
            fetch('/toggle_status', {method: 'POST'}).then(r => r.json()).then(data => {
                let b = document.getElementById('stat-badge');
                if(data.is_online) {
                    b.className = "badge bg-success"; b.innerText = "ONLINE";
                    this.innerText = "GO OFFLINE"; this.style.background = "#dc3545";
                } else {
                    b.className = "badge bg-danger"; b.innerText = "OFFLINE";
                    this.innerText = "GO ONLINE"; this.style.background = "#28a745";
                }
            });
        };
        {% endif %}
    </script>
</body>
</html>
