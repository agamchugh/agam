<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background-color: #1f2229; border: 1px solid #444; border-radius: 15px; width: 100%; max-width: 450px; }
        .card-header { border-bottom: 2px solid #f5b400; color: #f5b400; font-weight: bold; font-size: 1.5rem; text-align: center; }
        .form-control { background-color: #2d323b; border: 1px solid #444; color: white; }
        .form-control:focus { background-color: #2d323b; color: white; border-color: #f5b400; box-shadow: none; }
        .btn-warning { background-color: #f5b400; border: none; font-weight: bold; color: #121212; }
        label { color: #f5b400; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card shadow-lg">
    <div class="card-header py-3">
        EDIT USER SETTINGS
    </div>
    <div class="card-body p-4">
        <form method="POST" action="/update/{{user[0]}}">
            <div class="mb-2">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" value="{{user[1]}}" required>
            </div>

            <div class="mb-2">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" value="{{user[2]}}" required>
            </div>

            <div class="mb-2">
                <label>Phone Number</label>
                <input type="text" name="phone" class="form-control" value="{{user[3]}}" required>
            </div>

            <div class="mb-4">
                <label>New Password (will be hashed)</label>
                <input type="password" name="password" class="form-control" placeholder="Enter new password" required>
                <small class="text-muted">For security, enter a new password to save changes.</small>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-warning">Update User Profile</button>
                <a href="/admin" class="btn btn-outline-secondary">Cancel & Go Back</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
