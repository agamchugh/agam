<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { background-color: #1a1a1a !important; height: 100%; margin: 0; color: white; }
        .full-screen-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #1a1a1a; }
        .card { background-color: #2d2d2d; color: white; border: 1px solid #ff8c00; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 380px; }
        .btn-primary { background-color: #ff8c00 !important; border: none !important; color: black !important; font-weight: bold; }
        .form-control { background-color: #3d3d3d; color: white; border: 1px solid #555; }
        .form-control:focus { background-color: #4d4d4d; color: white; border-color: #ff8c00; box-shadow: none; }
        a { color: #ff8c00; text-decoration: none; }
    </style>
</head>
<body>
    <div class="full-screen-bg container-fluid">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">Login</h3>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="mt-3 text-center mb-0">No account? <a href="/signup">Sign up here</a></p>
        </div>
    </div>
</body>
</html>
