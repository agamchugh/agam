<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #2f323a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

/* background yellow shape */
body::before {
    content: "";
    position: absolute;
    width: 120%;
    height: 120%;
    background: #f5b400;
    top: -50%;
    left: 50%;
    border-bottom-left-radius: 60%;
    border-bottom-right-radius: 60%;
    transform: translateX(-50%);
    z-index: 0;
}

.phone {
    width: 320px;
    height: 600px;
    background: #1f2229;
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    position: relative;
    z-index: 1;
}

.title {
    text-align: center;
    color: #f5b400;
    margin-top: 20px;
    font-size: 20px;
}

.card {
    margin-top: 40px;
    background: #2c2f36;
    padding: 25px;
    border-radius: 25px;
}

.card h3 {
    text-align: center;
    color: white;
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 15px;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border: none;
    border-bottom: 1px solid #555;
    background: transparent;
    color: white;
    outline: none;
}

.btn {
    width: 100%;
    padding: 12px;
    background: #f5b400;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

.link {
    text-align: center;
    margin-top: 10px;
    color: #aaa;
    font-size: 12px;
}

a {
    color: #f5b400;
    text-decoration: none;
}
</style>

</head>

<body>

<div class="phone">

    <div class="title">Welcome Back!</div>

    <div class="card">
        <h3>LOGIN</h3>

        <form action="/login" method="POST">
            <div class="input-group">
                <input type="email" name="email" placeholder="Email">
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password">
            </div>

            <div class="link">Forgot Password?</div>

            <button class="btn">LOGIN</button>
        </form>

        <div class="link">
            Don't have account? <a href="/signup">Create Account</a>
        </div>
    </div>

</div>

</body>
</html>
