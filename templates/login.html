<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Page Title</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #1a1a1a !important; color: white; }
        .card { background-color: #2d2d2d; color: white; border: 1px solid #ff8c00; }
        .btn-primary, .btn-success { 
            background-color: #ff8c00 !important; 
            border-color: #ff8c00 !important; 
            color: black !important;
            font-weight: bold;
        }
        .btn-primary:hover { background-color: #e07b00 !important; }
        .form-control { background-color: #3d3d3d; color: white; border: 1px solid #555; }
        .form-control:focus { background-color: #4d4d4d; color: white; border-color: #ff8c00; box-shadow: 0 0 0 0.25rem rgba(255, 140, 0, 0.25); }
        a { color: #ff8c00; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Login</h3>
                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <p class="mt-3 text-center">No account? <a href="/signup">Sign up here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
