<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>Sign Up - Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Forces the dark background to cover the whole phone screen */
        html, body { 
            background-color: #1a1a1a !important; 
            height: 100%; 
            margin: 0; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .full-screen-bg { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #1a1a1a; 
            padding: 20px;
        }

        .card { 
            background-color: #2d2d2d; 
            color: white; 
            border: 1px solid #ff8c00; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px; 
            border-radius: 15px;
        }

        .form-label { font-weight: 500; color: #ccc; margin-bottom: 5px; }

        .form-control { 
            background-color: #3d3d3d; 
            color: white; 
            border: 1px solid #555; 
            border-radius: 8px;
            padding: 12px;
        }

        .form-control:focus { 
            background-color: #4d4d4d; 
            color: white; 
            border-color: #ff8c00; 
            box-shadow: 0 0 0 0.25rem rgba(255, 140, 0, 0.25); 
        }

        .btn-primary { 
            background-color: #ff8c00 !important; 
            border: none !important; 
            color: black !important; 
            font-weight: bold; 
            padding: 12px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-primary:hover { background-color: #e07b00 !important; }

        a { color: #ff8c00; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="full-screen-bg">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4" style="color: #ff8c00;">Create Account</h2>
            
            <form action="/signup" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter username">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" name="mobile" class="form-control" required placeholder="Ex: +91 0000000000">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>

            <p class="mt-4 text-center mb-0">
                Already have an account? <a href="/login">Login</a>
            </p>
        </div>
    </div>

</body>
</html>
