<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: #1e1e26; border: 1px solid #ffc107; padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; }
        .form-control { background: #2a2a35; color: white; border: 1px solid #444; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card shadow">
        <h3 class="text-center text-warning mb-4">Rickshaw App</h3>
        <form action="/signup" method="POST">
            <select name="role" class="form-control" required>
                <option value="rider">Register as Rider</option>
                <option value="driver">Register as Driver</option>
            </select>
            <input type="text" name="username" class="form-control" placeholder="Name" required>
            <input type="email" name="email" class="form-control" placeholder="Email" required>
            <input type="tel" name="mobile" class="form-control" placeholder="Mobile" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn btn-warning w-100 fw-bold">CREATE ACCOUNT</button>
        </form>
    </div>
</body>
</html>
