<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>Sign Up - Rickshaw App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { background-color: #1a1a1a; height: 100%; margin: 0; color: white; font-family: 'Segoe UI', sans-serif; }
        .full-screen-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background-color: #2d2d2d; border: 1px solid #ff8c00; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border-radius: 15px; }
        .form-control { background-color: #3d3d3d; color: white; border: 1px solid #555; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .btn-primary { background-color: #ff8c00 !important; border: none !important; color: black !important; font-weight: bold; padding: 12px; border-radius: 8px; text-transform: uppercase; width: 100%; }
        select.form-control { cursor: pointer; }
    </style>
</head>
<body>
    <div class="full-screen-bg">
        <div class="card p-4">
            <h2 class="text-center mb-4" style="color: #ff8c00;">Join Rickshaw App</h2>
            <form action="/signup" method="POST">
                <label class="form-label text-secondary">I want to:</label>
                <select name="role" class="form-control" required>
                    <option value="rider">Book a Ride (Rider)</option>
                    <option value="driver">Drive a Rickshaw (Driver)</option>
                </select>
                <input type="text" name="username" class="form-control" placeholder="Full Name" required>
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                <input type="tel" name="mobile" class="form-control" placeholder="Mobile Number" required>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            <p class="mt-4 text-center">Already have an account? <a href="/login" style="color: #ff8c00;">Login</a></p>
        </div>
    </div>
</body>
</html>
